name: Docker镜像备份到百度网盘
on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 读取images.txt并备份镜像
        env:
          BAIDU_BDUSS: ${{ secrets.BAIDU_BDUSS }}
          BAIDU_STOKEN: ${{ secrets.BAIDU_STOKEN }}
          PCS_VER: v3.9.7
          PCS_DIR: /tmp/pcs
          BAIDU_REMOTE_ROOT: /GitHub-Docker-Backup
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail

          # 安装依赖
          sudo apt-get update
          sudo apt-get install -y unzip

          # 下载BaiduPCS-Go
          mkdir -p ${PCS_DIR}
          cd ${PCS_DIR}
          echo "==> Downloading BaiduPCS-Go-${PCS_VER}-linux-amd64.zip"
          wget -q https://github.com/qjfoidnh/BaiduPCS-Go/releases/download/${PCS_VER}/BaiduPCS-Go-${PCS_VER}-linux-amd64.zip
          unzip -q BaiduPCS-Go-${PCS_VER}-linux-amd64.zip
          cd BaiduPCS-Go-${PCS_VER}-linux-amd64
          chmod +x BaiduPCS-Go
          sudo mv BaiduPCS-Go /usr/local/bin/

          # 登录网盘
          if [ -n "${BAIDU_STOKEN}" ];then
            BaiduPCS-Go login -bduss "${BAIDU_BDUSS}" -stoken "${BAIDU_STOKEN}"
          else
            BaiduPCS-Go login -bduss "${BAIDU_BDUSS}"
          fi
          BaiduPCS-Go mkdir ${BAIDU_REMOTE_ROOT} || true

          # ========== 重点：回到仓库目录，读取images.txt ==========
          cd ${GITHUB_WORKSPACE}
          IMAGE_LIST=$(grep -v '^#' images.txt | sed '/^\s*$/d')
          FAILED=0

          while IFS= read -r img; do
            echo "====================================="
            echo "开始处理镜像：$img"
            SAFE_NAME=$(echo "$img" | tr '/:' '_')
            TMP_FILE="${SAFE_NAME}.tar.gz"

            if docker pull "$img"; then
              docker save "$img" | gzip > "$TMP_FILE"
              echo "打包完成，开始上传 $TMP_FILE"
              BaiduPCS-Go upload "$TMP_FILE" ${BAIDU_REMOTE_ROOT}/
              rm -f "$TMP_FILE"
              docker rmi "$img" || true
              echo "$img 上传成功"
            else
              echo "⚠️ 镜像 $img 拉取失败，跳过"
              FAILED=$((FAILED+1))
            fi
          done <<< "$IMAGE_LIST"

          if [ "$FAILED" -gt 0 ];then
            echo "===== 有 ${FAILED} 个镜像处理失败 ====="
            exit 1
          fi
